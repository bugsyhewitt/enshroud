[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enshroud"
version = "1.0.0"
description = "Modern GraphQL attack-surface scanner for bug bounty and penetration testing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "graphql-core>=3.2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
ws = [
    "websockets>=12.0",
]
dev = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.scripts]
enshroud = "enshroud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"enshroud.data" = ["*.json", "*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "ship_gate: v1.0 release ship-gate (slow; runs build + fresh venv install + editable-install contract)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "W", "I"]
